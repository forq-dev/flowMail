name: "Continuous integration"

on:
  push:
    branches:
      - "main"
    tags:
      - "*"
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-ci-matrix-10:
    name: "Generate CI matrix (GLPI 10.0.x)"
    uses: "glpi-project/plugin-ci-workflows/.github/workflows/generate-ci-matrix.yml@v1"
    with:
      glpi-version: "10.0.x"

  ci-10:
    name: "GLPI ${{ matrix.glpi-version }} - php:${{ matrix.php-version }} - ${{ matrix.db-image }}"
    needs: "generate-ci-matrix-10"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-ci-matrix-10.outputs.matrix) }}
    uses: "glpi-project/plugin-ci-workflows/.github/workflows/continuous-integration.yml@v1"
    with:
      plugin-key: "flowMail"
      glpi-version: "${{ matrix.glpi-version }}"
      php-version: "${{ matrix.php-version }}"
      db-image: "${{ matrix.db-image }}"
      # Desabilitado até @glpi-versioning entregar CHANGELOG.md no formato exigido pelo gate.
      # Reativar (remover esta linha ou setar false) assim que o arquivo existir no repo.
      skip-changelog-check: true

  generate-ci-matrix-11:
    name: "Generate CI matrix (GLPI 11.0.x)"
    uses: "glpi-project/plugin-ci-workflows/.github/workflows/generate-ci-matrix.yml@v1"
    with:
      glpi-version: "11.0.x"

  ci-11:
    name: "GLPI ${{ matrix.glpi-version }} - php:${{ matrix.php-version }} - ${{ matrix.db-image }}"
    needs: "generate-ci-matrix-11"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-ci-matrix-11.outputs.matrix) }}
    uses: "glpi-project/plugin-ci-workflows/.github/workflows/continuous-integration.yml@v1"
    with:
      plugin-key: "flowMail"
      glpi-version: "${{ matrix.glpi-version }}"
      php-version: "${{ matrix.php-version }}"
      db-image: "${{ matrix.db-image }}"
      # Ver comentário acima (ci-10) sobre skip-changelog-check.
      skip-changelog-check: true
